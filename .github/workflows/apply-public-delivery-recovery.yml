name: Apply public delivery recovery

on:
  push:
    branches:
      - agent/broadcast-studio-ui
    paths:
      - scripts/apply-public-delivery-recovery.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/broadcast-studio-ui
          fetch-depth: 0

      - name: Assemble and validate patch
        run: |
          cat scripts/public-delivery-recovery-part-* > scripts/apply-public-delivery-recovery.py
          python -m py_compile scripts/apply-public-delivery-recovery.py

      - name: Apply recovery implementation
        run: |
          python scripts/apply-public-delivery-recovery.py
          rm -f scripts/public-delivery-recovery-part-*

      - name: Validate TypeScript and production builds
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add recoverable public delivery controls"
          git push origin HEAD:agent/broadcast-studio-ui
