name: Validate recording object storage implementation

on:
  push:
    branches: [agent/recording-object-storage]

permissions:
  contents: write

concurrency:
  group: validate-recording-object-storage
  cancel-in-progress: true

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_COOKIE_SECURE: false
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:8333
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: digistream-recordings
      OBJECT_STORAGE_ACCESS_KEY_ID: digistream
      OBJECT_STORAGE_SECRET_ACCESS_KEY: digistream-ci-storage-secret
      OBJECT_STORAGE_FORCE_PATH_STYLE: true
      RECORDING_ACCESS_SECRET: digistream-ci-recording-access-secret-at-least-32-bytes
      RECORDING_ACCESS_TTL_SECONDS: 120

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      object-storage:
        image: chrislusf/seaweedfs:4.29
        env:
          AWS_ACCESS_KEY_ID: digistream
          AWS_SECRET_ACCESS_KEY: digistream-ci-storage-secret
          S3_BUCKET: digistream-recordings
        ports:
          - 8333:8333

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/recording-object-storage
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Wait for S3-compatible storage
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8333' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Object storage did not become reachable.' >&2
          exit 1

      - name: Refresh locked dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Compose model
        run: docker compose -f compose.media.yml config --quiet

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate TypeScript, API tests and production builds
        run: npm run check

      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive browser regressions
        run: npx playwright test

      - name: Commit validated lockfile and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-recording-object-storage.yml
          git config user.name "Emmanuel Okunlola"
          git config user.email "74790322+emmy16-glitch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Lock recording object storage implementation"
          git push origin HEAD:agent/recording-object-storage
