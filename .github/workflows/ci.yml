name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node-version }} — typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:8333
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: digistream-recordings
      OBJECT_STORAGE_ACCESS_KEY_ID: digistream
      OBJECT_STORAGE_SECRET_ACCESS_KEY: digistream-ci-storage-secret
      OBJECT_STORAGE_FORCE_PATH_STYLE: true
      RECORDING_ACCESS_SECRET: digistream-ci-recording-access-secret-at-least-32-bytes
      RECORDING_ACCESS_TTL_SECONDS: 120

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      object-storage:
        image: chrislusf/seaweedfs:4.29
        env:
          AWS_ACCESS_KEY_ID: digistream
          AWS_SECRET_ACCESS_KEY: digistream-ci-storage-secret
          S3_BUCKET: digistream-recordings
        ports:
          - 8333:8333

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Wait for S3-compatible storage
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8333' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Object storage did not become reachable.' >&2
          exit 1

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify design skills
        id: skills
        continue-on-error: true
        run: npm run skills:verify

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Test
        id: test
        continue-on-error: true
        run: npm run test

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce validation result
        if: always()
        run: |
          echo "skills=${{ steps.skills.outcome }}"
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "test=${{ steps.test.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          test "${{ steps.skills.outcome }}" = success
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.build.outcome }}" = success

  ui-smoke:
    name: Playwright responsive creator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_COOKIE_SECURE: false
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser workflow
        run: npx playwright test

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-report
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  infrastructure:
    name: Compose, OME XML and API image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate shell and smoke scripts
        run: |
          sh -n scripts/media-stack-up.sh
          sh -n scripts/media-stack-down.sh
          node --check scripts/media-e2e-smoke.mjs

      - name: Validate Docker Compose model
        run: docker compose -f compose.media.yml config --quiet

      - name: Validate local Egress Chrome policy
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*enable_chrome_sandbox:[[:space:]]*true' infra/livekit/egress.yaml; then
            docker compose -f compose.media.yml config | grep -Eq 'seccomp=.*chrome-sandboxing'
          fi

      - name: Verify pinned OvenMediaEngine image exists
        run: |
          set -euo pipefail
          image="$(docker compose -f compose.media.yml config --images | grep -i ovenmediaengine | head -n 1)"
          test -n "$image"
          docker manifest inspect "$image" >/dev/null

      - name: Verify pinned SeaweedFS image exists
        run: |
          set -euo pipefail
          image="$(docker compose -f compose.media.yml config --images | grep -i seaweedfs | head -n 1)"
          test -n "$image"
          docker manifest inspect "$image" >/dev/null

      - name: Verify LiveKit CLI image starts
        run: docker compose -f compose.media.yml --profile tools run --rm --no-deps livekit-cli --version

      - name: Validate OvenMediaEngine XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('infra/ome/Server.xml')"

      - name: Build production API image
        run: docker build --file apps/api/Dockerfile --tag digistream-api:ci .
