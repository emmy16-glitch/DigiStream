name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node-version }} — typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload generated package lock
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate workspace
        run: npm run check
