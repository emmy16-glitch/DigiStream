name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node-version }} — typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated package lock
        if: >-
          matrix.node-version == '22.x' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock backend dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate workspace
        run: npm run check
