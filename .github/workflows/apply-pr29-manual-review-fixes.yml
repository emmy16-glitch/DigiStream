name: Apply PR 29 manual review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-pr29-manual-review-fixes
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'agent/broadcast-studio-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_COOKIE_SECURE: false
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/broadcast-studio-ui
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Apply manual review fixes
        run: |
          python3 scripts/apply-pr29-manual-review-fixes.py
          python3 scripts/apply-pr29-manual-review-fixes-v2.py
          python3 scripts/apply-pr29-manual-review-fixes-v3.py

      - name: Reject malformed patches
        run: git diff --check

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate TypeScript, API tests and builds
        run: npm run check

      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive browser regressions
        run: npx playwright test

      - name: Commit validated fixes and remove one-time automation
        run: |
          rm -f scripts/apply-pr29-manual-review-fixes.py
          rm -f scripts/apply-pr29-manual-review-fixes-v2.py
          rm -f scripts/apply-pr29-manual-review-fixes-v3.py
          rm -f .github/workflows/apply-pr29-manual-review-fixes.yml
          git config user.name "Emmanuel Okunlola"
          git config user.email "74790322+emmy16-glitch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix PR 29 manual review findings"
          git push origin HEAD:agent/broadcast-studio-ui
