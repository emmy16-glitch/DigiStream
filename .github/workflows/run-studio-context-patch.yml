name: Run Studio context patch

on:
  push:
    branches:
      - cline-progress-2026-08-02
    paths:
      - .github/workflows/run-studio-context-patch.yml

permissions:
  contents: write

jobs:
  patch-commit-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cline-progress-2026-08-02

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Execute existing Studio context patch
        shell: bash
        run: |
          python3 <<'BOOT'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/resolve-app-studio-context.yml').read_text()
          match = re.search(
              r"^\s*python3 <<'PY'\n(?P<script>.*?)^\s*PY$",
              workflow,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit('Could not locate the existing Studio context patch script.')
          script = textwrap.dedent(match.group('script'))
          exec(compile(script, 'resolve-app-studio-context.py', 'exec'), {'__name__': '__main__'})
          BOOT

      - name: Commit production wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/features/broadcasting/CreatorBroadcastStudio.tsx
          git diff --cached --check
          git commit -m "Wire authoritative Studio context through App"
          git push origin HEAD:cline-progress-2026-08-02

      - name: Install dependencies
        run: npm ci

      - name: Validate typecheck, API tests and production builds
        run: npm run check
