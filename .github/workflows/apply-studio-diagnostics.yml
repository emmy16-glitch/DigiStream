name: Apply Studio diagnostics patch

on:
  push:
    branches:
      - agent/broadcast-studio-ui
    paths:
      - scripts/apply-studio-diagnostics.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/broadcast-studio-ui
          fetch-depth: 0

      - name: Apply exact Studio source patch
        run: |
          cat scripts/studio-diagnostics.patch.part-* > /tmp/studio-diagnostics.patch
          git apply --check /tmp/studio-diagnostics.patch
          git apply /tmp/studio-diagnostics.patch

      - name: Commit generated Studio integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/broadcasting/CreatorBroadcastStudio.tsx
          git commit -m "Integrate Studio diagnostics and microphone states"
          git push origin HEAD:agent/broadcast-studio-ui
