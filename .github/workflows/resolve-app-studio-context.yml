name: Resolve App Studio context

on:
  push:
    branches:
      - cline-progress-2026-08-02
    paths:
      - .github/workflows/resolve-app-studio-context.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cline-progress-2026-08-02

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Wire authoritative Studio context
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('apps/web/src/App.tsx')
          app = app_path.read_text()

          app = replace_once(
              app,
              "import { CreatorBroadcastStudio } from './features/broadcasting/CreatorBroadcastStudio';\n",
              "import { CreatorBroadcastStudio } from './features/broadcasting/CreatorBroadcastStudio';\n"
              "import type { RequestedStudioContext } from './features/broadcasting/studio-context-selection';\n",
              'App Studio context import',
          )

          app = replace_once(
              app,
              "  const [studioOpen, setStudioOpen] = useState(false);\n",
              "  const [studioOpen, setStudioOpen] = useState(false);\n"
              "  const [studioContext, setStudioContext] = useState<RequestedStudioContext>({});\n",
              'App Studio context state',
          )

          open_broadcasts = """  function openBroadcastsSetup() {
            selectNavigation('Broadcasts');
            window.requestAnimationFrame(() => {
              document.getElementById('create-broadcast-title')?.focus();
            });
          }
          """
          app = replace_once(
              app,
              open_broadcasts,
              open_broadcasts + """
          function openStudio(context?: RequestedStudioContext) {
            setStudioContext(context ?? {});
            setStudioOpen(true);
          }

          function closeStudio() {
            setStudioOpen(false);
            setStudioContext({});
          }
          """,
              'App Studio open and close handlers',
          )

          setup_state = """  const setupState = creatorSetupState({
            intentChosen: creatorIntentChosen || Boolean(primaryOrganisation),
            hasOrganisation: Boolean(primaryOrganisation),
            channelStatus: overviewState.channelStatus,
            broadcastStatus: overviewState.broadcastStatus,
          });
          """
          app = replace_once(
              app,
              setup_state,
              setup_state + """
          const overviewStudioContext: RequestedStudioContext | undefined =
            primaryOrganisation && overviewState.selectedChannel && overviewState.selectedBroadcast
              ? {
                  organisationId: primaryOrganisation.id,
                  channelId: overviewState.selectedChannel.id,
                  broadcastId: overviewState.selectedBroadcast.id,
                }
              : undefined;
          """,
              'App Overview Studio context derivation',
          )

          overview_open_count = app.count("onClick={() => setStudioOpen(true)}")
          if overview_open_count == 0:
              raise SystemExit('App Overview Studio actions: no direct open actions found')
          app = app.replace(
              "onClick={() => setStudioOpen(true)}",
              "onClick={() => openStudio(overviewStudioContext)}",
          )

          app = replace_once(
              app,
              "        onOpenStudio={() => setStudioOpen(true)}\n",
              "        onOpenStudio={openStudio}\n",
              'Broadcasts page Studio callback',
          )

          app = replace_once(
              app,
              """      {studioOpen ? (
                <CreatorBroadcastStudio onClose={() => setStudioOpen(false)} open />
              ) : null}
          """,
              """      {studioOpen ? (
                <CreatorBroadcastStudio
                  onClose={closeStudio}
                  open
                  requestedContext={studioContext}
                />
              ) : null}
          """,
              'Studio render context',
          )

          app_path.write_text(app)

          studio_path = Path('apps/web/src/features/broadcasting/CreatorBroadcastStudio.tsx')
          studio = studio_path.read_text()

          studio = replace_once(
              studio,
              "import './creator-broadcast-studio.css';\n",
              "import {\n"
              "  resolveStudioContextSelection,\n"
              "  type RequestedStudioContext,\n"
              "} from './studio-context-selection';\n"
              "import './creator-broadcast-studio.css';\n",
              'Studio selection import',
          )

          studio = replace_once(
              studio,
              """type CreatorBroadcastStudioProps = {
            open: boolean;
            onClose(): void;
          };
          """,
              """type CreatorBroadcastStudioProps = {
            open: boolean;
            onClose(): void;
            requestedContext?: RequestedStudioContext;
          };
          """,
              'Studio props',
          )

          studio = replace_once(
              studio,
              """export function CreatorBroadcastStudio({
            open,
            onClose,
          }: CreatorBroadcastStudioProps) {
          """,
              """export function CreatorBroadcastStudio({
            open,
            onClose,
            requestedContext,
          }: CreatorBroadcastStudioProps) {
          """,
              'Studio props destructuring',
          )

          studio = replace_once(
              studio,
              """      .then((response) => {
                setOrganisations(response.organisations);
                setOrganisationId((current) => current || response.organisations[0]?.id || '');
              })
          """,
              """      .then((response) => {
                setOrganisations(response.organisations);
                const requestedOrganisationId = requestedContext?.organisationId?.trim();
                setOrganisationId((current) => {
                  if (
                    requestedOrganisationId &&
                    response.organisations.some((item) => item.id === requestedOrganisationId)
                  ) {
                    return requestedOrganisationId;
                  }
                  return response.organisations.some((item) => item.id === current)
                    ? current
                    : response.organisations[0]?.id || '';
                });
              })
          """,
              'Studio organisation preselection',
          )
          studio = replace_once(
              studio,
              "  }, [open, user]);\n",
              "  }, [open, requestedContext, user]);\n",
              'Studio organisation dependencies',
          )

          studio = replace_once(
              studio,
              """      .then((response) => {
                setChannels(response.channels);
                setChannelId((current) =>
                  response.channels.some((item) => item.id === current)
                    ? current
                    : response.channels[0]?.id || '',
                );
              })
          """,
              """      .then((response) => {
                setChannels(response.channels);
                const requestedChannelId = requestedContext?.channelId?.trim();
                const activeChannels = response.channels.filter(
                  (item) => item.status === 'active',
                );
                setChannelId((current) => {
                  if (
                    requestedChannelId &&
                    activeChannels.some((item) => item.id === requestedChannelId)
                  ) {
                    return requestedChannelId;
                  }
                  return activeChannels.some((item) => item.id === current)
                    ? current
                    : activeChannels[0]?.id || '';
                });
              })
          """,
              'Studio channel preselection',
          )
          studio = replace_once(
              studio,
              "  }, [organisationId]);\n",
              "  }, [organisationId, requestedContext]);\n",
              'Studio channel dependencies',
          )

          studio = replace_once(
              studio,
              """      .then((response) => {
                setBroadcasts(response.broadcasts);
                const available = response.broadcasts.filter((item) =>
                  contributionStates.has(item.status),
                );
                setBroadcastId((current) =>
                  available.some((item) => item.id === current)
                    ? current
                    : available[0]?.id || '',
                );
              })
          """,
              """      .then((response) => {
                setBroadcasts(response.broadcasts);
                const requestedBroadcastId = requestedContext?.broadcastId?.trim();
                const available = response.broadcasts.filter((item) =>
                  contributionStates.has(item.status),
                );
                setBroadcastId((current) => {
                  if (
                    requestedBroadcastId &&
                    available.some((item) => item.id === requestedBroadcastId)
                  ) {
                    return requestedBroadcastId;
                  }
                  return available.some((item) => item.id === current)
                    ? current
                    : available[0]?.id || '';
                });
              })
          """,
              'Studio broadcast preselection',
          )
          studio = replace_once(
              studio,
              "  }, [channelId, organisationId]);\n",
              "  }, [channelId, organisationId, requestedContext]);\n",
              'Studio broadcast dependencies',
          )

          broadcast_effect_end = "  }, [channelId, organisationId, requestedContext]);\n"
          resolver_effect = """

          useEffect(() => {
            if (
              !open ||
              loadingOrganisations ||
              loadingChannels ||
              loadingBroadcasts
            ) {
              return;
            }

            const selection = resolveStudioContextSelection({
              requested: requestedContext ?? {},
              organisations,
              channels,
              broadcasts,
            });

            if (
              selection.organisationId &&
              selection.organisationId !== organisationId
            ) {
              setOrganisationId(selection.organisationId);
              return;
            }
            if (selection.channelId && selection.channelId !== channelId) {
              setChannelId(selection.channelId);
              return;
            }
            if (selection.broadcastId !== broadcastId) {
              setBroadcastId(selection.broadcastId);
              return;
            }

            if (selection.fallbackReason) {
              setMessage(
                'The requested Studio selection was no longer available. DigiStream opened the safest available broadcast instead.',
              );
            }
          }, [
            broadcastId,
            broadcasts,
            channelId,
            channels,
            loadingBroadcasts,
            loadingChannels,
            loadingOrganisations,
            open,
            organisationId,
            organisations,
            requestedContext,
          ]);
          """
          studio = replace_once(
              studio,
              broadcast_effect_end,
              broadcast_effect_end + resolver_effect,
              'Studio authoritative resolver effect',
          )

          studio_path.write_text(studio)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate typecheck, API tests and production builds
        run: npm run check

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/features/broadcasting/CreatorBroadcastStudio.tsx
          git diff --cached --check
          git commit -m "Wire authoritative Studio context through App"
          git push origin HEAD:cline-progress-2026-08-02
