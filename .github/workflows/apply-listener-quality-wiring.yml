name: Apply listener quality wiring

on:
  push:
    branches:
      - agent/phase-6a-next-production-readiness
    paths:
      - .github/workflows/apply-listener-quality-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6a-next-production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-listener-quality-wiring.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Wire measured listener playback quality"
          git push origin HEAD:agent/phase-6a-next-production-readiness
