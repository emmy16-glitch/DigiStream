name: Validate public replay backend

on:
  push:
    branches: [agent/public-replay-listening]

permissions:
  contents: write

concurrency:
  group: public-replay-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_COOKIE_SECURE: false
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/public-replay-listening
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Apply backend and contract wiring
        run: python3 scripts/apply-public-replay-backend-wiring.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run focused replay integration coverage
        run: npx tsx --test apps/api/test/public-replays.integration.test.ts

      - name: Run complete API suite
        run: npm run test

      - name: Build production workspaces
        run: npm run build

      - name: Commit validated backend and remove one-time automation
        run: |
          set -euo pipefail
          rm -f scripts/apply-public-replay-backend-wiring.py
          rm -f .github/workflows/validate-public-replay-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "Add authorised public replay API foundation"
            git push origin HEAD:agent/public-replay-listening
          fi
