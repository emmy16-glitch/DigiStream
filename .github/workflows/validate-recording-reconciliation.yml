name: Validate recording retry and reconciliation implementation

on:
  push:
    branches: [agent/recording-reconciliation]

permissions:
  contents: write

concurrency:
  group: recording-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_COOKIE_SECURE: false
      DATABASE_URL: postgresql://digistream:digistream@127.0.0.1:5432/digistream_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digistream
          POSTGRES_PASSWORD: digistream
          POSTGRES_DB: digistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digistream -d digistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/recording-reconciliation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Apply route, status and documentation wiring
        run: python3 scripts/apply-recording-reconciliation-wiring.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate TypeScript
        run: timeout 180s npm run typecheck

      - name: Run recording job integration coverage
        run: timeout --signal=KILL 90s npx tsx --test apps/api/test/recording-jobs.integration.test.ts

      - name: Run complete API integration suite
        run: timeout --signal=KILL 240s npm run test

      - name: Build production workspaces
        run: timeout 180s npm run build

      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive browser regressions
        run: timeout --signal=KILL 240s npx playwright test

      - name: Commit validated implementation and remove one-time automation
        run: |
          set -euo pipefail
          rm -f scripts/apply-recording-reconciliation-wiring.py
          rm -f .github/workflows/validate-recording-reconciliation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "Add durable recording retries and reconciliation"
            git push origin HEAD:agent/recording-reconciliation
          fi
